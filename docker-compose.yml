services:
  java-service:
    build:
      context: ../java-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-example}
      DB_NAME: ${DB_NAME:-copilot_db}
    restart: unless-stopped
    depends_on:
      - db

  python-service:
    build:
      context: ../python-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  webui-service:
    build:
      context: ../webui-service
    ports:
      - "3000:3000"
    depends_on:
      - java-service
      - python-service
      - net-service
    restart: unless-stopped

  net-service:
    build:
      context: ../.net-service
    ports:
      - "5224:8080"
    restart: unless-stopped

  mock-graph:
    image: ghcr.io/sergey-shulyak/mock-graph-server:latest
    ports:
      - "8088:8080"
    restart: unless-stopped

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-example}
      POSTGRES_DB: ${DB_NAME:-copilot_db}
    volumes:
          - pg_data:/var/lib/postgresql

volumes:
  pg_data:    