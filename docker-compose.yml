services:
  java-service:
    build:
      context: ../java-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped

  python-service:
    build:
      context: ../python-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  webui-service:
    build:
      context: ../webui-service
    ports:
      - "3000:3000"
    depends_on:
      - java-service
      - python-service
    restart: unless-stopped

  mock-graph:
    image: ghcr.io/sergey-shulyak/mock-graph-server:latest
    ports:
      - "8088:8080"