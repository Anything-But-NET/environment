x-vars:
  - &db_pass ${DB_PASSWORD:-example}
  - &db_user ${DB_USER:-postgres}
  - &db_name ${DB_NAME:-copilot_db}

services:
  java-service:
    build:
      context: ../java-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_USER: *db_user
      DB_PASSWORD: *db_pass
      DB_NAME: *db_name
      KAFKA_BROKER: "kafka:9094"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      kafka:
        condition: service_healthy

  python-service:
    build:
      context: ../python-service
    ports:
      - "8000:8000"
    extra_hosts:
          - "host.docker.internal:host-gateway"
    environment:
      USER: *db_user
      PASS: *db_pass
      DB: *db_name
      KAFKA_BROKER: "kafka:9094"
      VECTORIZER_GRPC_TARGET: "host.docker.internal:50051"
    command: >
          sh -c 'export DATABASE_URL="postgresql://$$USER:$$PASS@db:5432/$$DB" && 
          exec uv run python -m python_service.main'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      kafka:
        condition: service_healthy

  webui-service:
    build:
      context: ../webui-service
    ports:
      - "3000:3000"
    depends_on:
      - java-service
      - python-service
      - net-service
    restart: unless-stopped

  net-service:
    build:
      context: ../.net-service
    ports:
      - "5224:8080"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  mock-graph:
    image: ghcr.io/sergey-shulyak/mock-graph-server:latest
    ports:
      - "8088:8080"
    restart: unless-stopped
      
  db:
    image: pgvector/pgvector:pg18-trixie
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: *db_user
      POSTGRES_PASSWORD: *db_pass
      POSTGRES_DB: *db_name
    volumes:
      - pg_data:/var/lib/postgresql
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
      
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
          test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 15s
      
volumes:
  pg_data:
  kafka_data:
