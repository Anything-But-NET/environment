        p95_latency_ms:
          type: number
          format: float
          minimum: 0.0
          nullable: true
          description: 95th percentile RAG generation latency in milliseconds.
        reason_code_counts:
          type: array
          description: Aggregated counts grouped by QuestionOutcomeReasonCode enum.
          items:
            $ref: '#/components/schemas/ReasonCodeCount'
        error_category_counts:
          type: array
          description: Aggregated counts grouped by ErrorCategory enum (for FAILURE outcomes).
          items:
            $ref: '#/components/schemas/ErrorCategoryCount'
        channel_counts:
          type: array
          description: Aggregated counts grouped by ChatChannel enum.
          items:
            $ref: '#/components/schemas/ChannelCount'
        daily_trend:
          type: array
          description: Daily time-series breakdown ordered ascending by UTC date.
          items:
            $ref: '#/components/schemas/DailyOutcomePoint'

