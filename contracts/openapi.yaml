openapi: 3.0.3
info:
  title: Multi-Service REST API Contracts
  description: >
    OpenAPI contracts for synchronous REST communication:
    Gateway <-> Core, Core <-> RAG, and Web Dashboard BFF <-> Core.
    Kafka event payload schemas live in openapi-kafka.yaml.
    Shared enums and types live in shared.yaml.
  version: 2.0.0

tags:
  - name: GatewayToCore
    description: Communication between Chat Gateway (Slack/Teams) and Core system.
  - name: CoreToRag
    description: Communication between Core and RAG/Retrieval service.
  - name: WebAPI
    description: Stateless Bearer-JWT REST API consumed by the Next.js Web Dashboard BFF.

paths:
  # =============================================================
  # GATEWAY -> CORE
  # =============================================================
  /api/v1/chat/question:
    post:
      tags:
        - GatewayToCore
      summary: "[Gateway -> Core] Forward user question"
      description: >
        Invoked by the Gateway (Slack/Teams integration) to process an incoming
        user question through Core orchestration. Citations in the response are
        fully enriched by Core: RAG returns only document_id/chunk_id/score, and
        Core resolves title and url by document_id from its document metadata store.
      operationId: processUserQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserQuestionRequest'
            example:
              query_id: "req-123"
              channel: "teams"
              user_email: "oleh.pona@company.com"
              query: "How to get internet compensation?"
      responses:
        '200':
          description: Question successfully processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQuestionResponse'
              examples:
                Answered:
                  summary: Direct answer generated by RAG
                  value:
                    query_id: "req-123"
                    status: "ANSWERED"
                    reply_text: "To get internet compensation, submit the reimbursement form on SharePoint."
                    citations:
                      - title: "IT Compensation Guidelines"
                        url: "https://company.sharepoint.com/docs/it-comp"
                        document_id: "doc-456"
                        chunk_id: "123e4567-e89b-12d3-a456-426614174000"
                        score: 0.95
                EscalatedToExpert:
                  summary: Low confidence or missing docs, ticket created
                  value:
                    query_id: "req-123"
                    status: "ESCALATED_TO_EXPERT"
                    reply_text: "I couldn't find a confident answer in the knowledge base. I have created a support ticket for an expert to assist you."
                    citations: []
        '400':
          description: Bad Request (invalid user input or malformed payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
              example:
                query_id: "req-123"
                error_code: "BAD_REQUEST"
                user_message: "Your question is empty or exceeds the maximum allowed length."
        '500':
          description: Internal Server Error in Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
              example:
                query_id: "req-123"
                error_code: "INTERNAL_ERROR"
                user_message: "An unexpected error occurred while processing your request."
        '503':
          description: Service Unavailable (downstream RAG/LLM or database outage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
              example:
                query_id: "req-123"
                error_code: "SERVICE_UNAVAILABLE"
                user_message: "The knowledge assistant is temporarily unavailable. Please try again in a few minutes."

  # =============================================================
  # CORE -> RAG
  # =============================================================
  /api/v1/rag/generate:
    post:
      tags:
        - CoreToRag
      summary: "[Core -> RAG] Retrieve context and generate answer"
      description: >
        Invoked by Core after resolving user ACL groups. Performs permission-filtered
        retrieval and generates a grounded answer with lightweight citations
        (document_id, chunk_id, score only). Core is responsible for enriching
        them with title and url before responding to the Gateway.
      operationId: generateRagAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRetrievalRequest'
            example:
              query_id: "req-123"
              query: "How to get internet compensation?"
              user_permissions:
                allowed_groups:
                  - "devs"
                  - "all-employees"
                  - "oleh.pona@company.com"
      responses:
        '200':
          description: Successfully executed retrieval and generation pipeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagRetrievalResponse'
              examples:
                Success:
                  summary: Relevant documents found and answer generated
                  value:
                    query_id: "req-123"
                    status: "ANSWER_GENERATED"
                    answer: "To get compensation, fill out the reimbursement form..."
                    confidence_score: 0.89
                    citations:
                      - document_id: "doc-456"
                        chunk_id: "123e4567-e89b-12d3-a456-426614174000"
                        score: 0.95
                EmptyResult:
                  summary: No matching documents found for query and ACL groups
                  value:
                    query_id: "req-123"
                    status: "EMPTY_RETRIEVAL"
                    answer: null
                    confidence_score: 0.0
                    citations: []
                LowConfidence:
                  summary: Documents found but confidence is below threshold
                  value:
                    query_id: "req-123"
                    status: "LOW_CONFIDENCE"
                    answer: "Based on partial records, compensation might require manager approval..."
                    confidence_score: 0.35
                    citations:
                      - document_id: "doc-789"
                        chunk_id: "987e6543-e21b-12d3-a456-426614174999"
                        score: 0.42
        '400':
          description: Bad Request (malformed JSON or invalid business parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                query_id: "req-123"
                status: "VALIDATION_ERROR"
                message: "Malformed request payload"
                description: "JSON body could not be parsed."
                timestamp: 1730000000
        '422':
          description: Unprocessable Entity (schema validation failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                query_id: "req-123"
                status: "VALIDATION_ERROR"
                message: "Query cannot be empty and allowed_groups must contain at least 1 item"
                description: "Field 'query' failed minLength validation."
                timestamp: 1730000000
        '500':
          description: Internal Server Error during RAG pipeline execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                query_id: "req-123"
                status: "INTERNAL_ERROR"
                message: "Unexpected failure during prompt assembly"
                description: null
                timestamp: 1730000000
        '503':
          description: Service Unavailable (Vector DB or LLM provider timeout/outage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                query_id: "req-123"
                status: "VECTOR_DB_UNAVAILABLE"
                message: "Failed to connect to vector database cluster"
                description: "Connection timed out after 5000ms"
                timestamp: 1730000000

  # =============================================================
  # WEB DASHBOARD BFF -> CORE (WebAPI)
  # =============================================================
  /api/v1/dash/auth/login:
    post:
      tags:
        - WebAPI
      summary: "[Web Dashboard] Authenticate operator and issue JWT pair"
      description: >
        Authenticates an active dashboard operator by email and password and issues
        an access + refresh JWT pair. The Next.js BFF stores these in HttpOnly cookies.
      operationId: loginOperator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful; access and refresh JWTs issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardErrorResponse'
              example:
                error_code: "UNAUTHORIZED"
                message: "Invalid email or password."
                timestamp: "2026-11-13T12:00:00Z"
        '403':
          description: Operator account is BLOCKED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardErrorResponse'
              example:
                error_code: "FORBIDDEN"
                message: "Operator account is BLOCKED."
                timestamp: "2026-11-13T12:00:00Z"

  /api/v1/dash/auth/refresh:
    post:
      tags:
        - WebAPI
      summary: "[Web Dashboard] Rotate/refresh access JWT using refresh token"
      description: >
        Exchanges a valid refresh token for a fresh access/refresh token pair.
        Rejects tokens belonging to BLOCKED operators and updates last_refreshed_at.
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Access token refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardErrorResponse'
              example:
                error_code: "UNAUTHORIZED"
                message: "Invalid or expired refresh token."
                timestamp: "2026-11-13T12:00:00Z"
        '403':
          description: Operator account is BLOCKED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardErrorResponse'
              example:
                error_code: "FORBIDDEN"
                message: "Operator account is BLOCKED."
                timestamp: "2026-11-13T12:00:00Z"

  /api/v1/dash/logs/ingestion:
    get:
      tags:
        - WebAPI
      summary: "[Web Dashboard] List ingestion sync runs"
      description: >
        Returns paginated ingestion sync runs from core.document_sync_runs ordered
        by started_at descending. Requires LOGS authority.
      operationId: getIngestionLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/FromTimestampParam'
        - $ref: '#/components/parameters/ToTimestampParam'
        - name: status
          in: query
          required: false
          description: Optional filter by ingestion sync status.
          schema:
            $ref: './shared.yaml#/components/schemas/SyncStatus'
        - name: document_id
          in: query
          required: false
          description: Optional filter by source document ID.
          schema:
            type: string
      responses:
        '200':
          description: Paginated ingestion logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionLogsPage'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'

  /api/v1/dash/logs/generation:
    get:
      tags:
        - WebAPI
      summary: "[Web Dashboard] List RAG generation diagnostic logs"
      description: >
        Returns paginated generation diagnostics from core.generation_diagnostics
        ordered by created_at descending. Requires LOGS authority.
      operationId: getGenerationLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/FromTimestampParam'
        - $ref: '#/components/parameters/ToTimestampParam'
        - name: outcome
          in: query
          required: false
          description: Optional filter by generation outcome.
          schema:
            $ref: './shared.yaml#/components/schemas/GenerationOutcome'
        - name: error_category
          in: query
          required: false
          description: Optional filter by error category.
          schema:
            $ref: './shared.yaml#/components/schemas/ErrorCategory'
      responses:
        '200':
          description: Paginated generation diagnostic logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationLogsPage'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'

  /api/v1/dash/documents:
    get:
      tags:
        - WebAPI
      summary: "[Web Dashboard] List synced document metadata"
      description: >
        Returns paginated document metadata from core.document_metadata.
        Requires METADATA authority.
      operationId: getDocuments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated document metadata list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsPage'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'

  /api/v1/dash/users:
    get:
      tags:
        - WebAPI
      summary: "[Web Dashboard] List synced user ACLs"
      description: >
        Returns paginated user ACL entries from core.users.
        Requires USERS authority.
      operationId: getUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated user ACL list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPage'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'

  /api/v1/dash/operators:
    get:
      tags:
        - WebAPI
      summary: "[Web Dashboard] List dashboard operators"
      description: >
        Returns paginated operator accounts from core.dashboard_operators
        (excluding password_hash). Requires OPERATORS authority.
      operationId: getOperators
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated operator list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorsPage'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'

  /api/v1/dash/operators/{id}/status:
    patch:
      tags:
        - WebAPI
      summary: "[Web Dashboard] Block or unblock a dashboard operator"
      description: >
        Updates an operator's status (ACTIVE or BLOCKED). Blocking immediately
        prevents refresh token exchange for that operator. Requires OPERATORS authority.
      operationId: updateOperatorStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Operator UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperatorStatusRequest'
      responses:
        '200':
          description: Operator status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorItem'
        '400':
          $ref: '#/components/responses/DashboardBadRequest'
        '401':
          $ref: '#/components/responses/DashboardUnauthorized'
        '403':
          $ref: '#/components/responses/DashboardForbidden'
        '404':
          $ref: '#/components/responses/DashboardNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Zero-based page index (Spring Pageable default 0).
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: Page size (Spring Pageable default 20, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromTimestampParam:
      name: from
      in: query
      required: false
      description: Inclusive lower timestamp bound (ISO-8601 UTC date-time).
      schema:
        type: string
        format: date-time
    ToTimestampParam:
      name: to
      in: query
      required: false
      description: Inclusive upper timestamp bound (ISO-8601 UTC date-time).
      schema:
        type: string
        format: date-time

  responses:
    DashboardBadRequest:
      description: Bad Request (invalid query parameters or request body).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardErrorResponse'
          example:
            error_code: "BAD_REQUEST"
            message: "Invalid query parameter 'page': must be >= 0."
            timestamp: "2026-11-13T12:00:00Z"
    DashboardUnauthorized:
      description: Unauthorized (missing, invalid, or expired Bearer access token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardErrorResponse'
          example:
            error_code: "UNAUTHORIZED"
            message: "Missing or expired Bearer access token."
            timestamp: "2026-11-13T12:00:00Z"
    DashboardForbidden:
      description: Forbidden (missing required operator authority or account blocked).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardErrorResponse'
          example:
            error_code: "FORBIDDEN"
            message: "Missing required authority or operator is BLOCKED."
            timestamp: "2026-11-13T12:00:00Z"
    DashboardNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardErrorResponse'
          example:
            error_code: "NOT_FOUND"
            message: "Operator not found."
            timestamp: "2026-11-13T12:00:00Z"

  schemas:
    # -------------------------------------------------------------
    # GATEWAY <-> CORE
    # -------------------------------------------------------------
    UserQuestionRequest:
      type: object
      required:
        - query_id
        - channel
        - user_email
        - query
      properties:
        query_id:
          type: string
          minLength: 1
          description: Unified correlation/trace ID generated by the Gateway.
        channel:
          type: string
          enum: [slack, teams]
          description: Source communication platform.
        user_email:
          type: string
          format: email
          description: Authenticated user email address.
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Raw question text submitted by the user.

    UserQuestionResponse:
      type: object
      required:
        - query_id
        - status
        - reply_text
        - citations
      properties:
        query_id:
          type: string
          description: Unified correlation/trace ID matching the request.
        status:
          type: string
          enum: [ANSWERED, ESCALATED_TO_EXPERT]
          description: Resolution outcome handled by Core.
        reply_text:
          type: string
          description: Final formatted message to display to the user in Slack/Teams.
        citations:
          type: array
          description: Citations fully enriched by Core with title and url.
          items:
            $ref: '#/components/schemas/Citation'

    GatewayErrorResponse:
      type: object
      required:
        - query_id
        - error_code
        - user_message
      properties:
        query_id:
          type: string
          nullable: true
          description: Unified correlation/trace ID (null if missing in malformed request).
        error_code:
          type: string
          enum: [BAD_REQUEST, UNAUTHORIZED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
          description: High-level error category for the Gateway.
        user_message:
          type: string
          description: Safe, user-friendly error message suitable for display in chat.

    # -------------------------------------------------------------
    # CORE <-> RAG
    # -------------------------------------------------------------
    RagRetrievalRequest:
      type: object
      required:
        - query_id
        - query
        - user_permissions
      properties:
        query_id:
          type: string
          minLength: 1
          description: Unified correlation/trace ID passed from Gateway via Core.
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Sanitized user question text.
        user_permissions:
          $ref: './shared.yaml#/components/schemas/AclPayload'

    RagRetrievalResponse:
      type: object
      required:
        - query_id
        - status
        - confidence_score
        - citations
      properties:
        query_id:
          type: string
          description: Unified correlation/trace ID matching the request.
        status:
          type: string
          enum: [ANSWER_GENERATED, EMPTY_RETRIEVAL, LOW_CONFIDENCE, ERROR]
          description: >
            Execution status of the RAG pipeline. EMPTY_RETRIEVAL indicates no documents
            matched the query/ACL filter; LOW_CONFIDENCE indicates score below threshold.
        answer:
          type: string
          nullable: true
          description: Generated answer from LLM (null when status is EMPTY_RETRIEVAL).
        confidence_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: >
            Aggregated confidence score. If below threshold (e.g., 0.5) or status is not
            ANSWER_GENERATED, Core escalates to a human expert.
        citations:
          type: array
          description: >
            Lightweight references to retrieved chunks (empty if none found).
            Contains NO display metadata (title/url) - Core enriches them
            before returning the response to the Gateway.
          items:
            $ref: '#/components/schemas/RagCitation'

    RagCitation:
      type: object
      description: Minimal chunk reference returned by RAG. Enriched by Core into Citation.
      required:
        - document_id
        - chunk_id
        - score
      properties:
        document_id:
          type: string
          description: Unique identifier of the parent document.
        chunk_id:
          type: string
          format: uuid
          description: Unique UUID of the retrieved text chunk.
        score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance/similarity score of the retrieved chunk.

    Citation:
      type: object
      description: >
        Fully enriched citation returned to the Gateway. Built by Core from
        RagCitation plus title/url resolved by document_id.
      required:
        - title
        - url
        - document_id
        - chunk_id
        - score
      properties:
        title:
          type: string
          description: Human-readable title of the source document.
        url:
          type: string
          format: uri
          description: Direct URL to the source document.
        document_id:
          type: string
          description: Unique identifier of the parent document.
        chunk_id:
          type: string
          format: uuid
          description: Unique UUID of the retrieved text chunk.
        score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance/similarity score of the retrieved chunk.

    GenerationError:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        query_id:
          type: string
          nullable: true
          description: Unified trace ID (null if request parsing failed before extraction).
        status:
          $ref: './shared.yaml#/components/schemas/RagErrorStatus'
        message:
          type: string
          description: Concise summary of the error.
        description:
          type: string
          nullable: true
          description: Detailed diagnostic information for logs.
        timestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp in seconds when the error occurred.

    # -------------------------------------------------------------
    # WEB DASHBOARD (WebAPI)
    # -------------------------------------------------------------
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "oleh.pona@company.com"
        password:
          type: string
          format: password
          minLength: 1
          example: "securepassword123"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Previously issued JWT refresh token.

    AuthTokensResponse:
      type: object
      required:
        - access_token
        - access_expires_in
        - refresh_token
        - refresh_expires_in
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token carrying email and authorities claims.
        access_expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Access token lifetime in seconds.
        refresh_token:
          type: string
          description: Long-lived JWT refresh token for rotating access tokens.
        refresh_expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Refresh token lifetime in seconds.

    UpdateOperatorStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: './shared.yaml#/components/schemas/OperatorStatus'

    DashboardErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        timestamp:
