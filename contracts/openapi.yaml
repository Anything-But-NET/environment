        outcome_counts:
          type: array
          description: Per-outcome counts for this date, keyed by GenerationOutcome enum.
          items:
            $ref: '#/components/schemas/OutcomeCount'

    QuestionOutcomesAnalyticsResponse:
      type: object
      additionalProperties: false
      required:
        - total_questions
        - outcome_counts
        - confidence_buckets
        - reason_code_counts
        - error_category_counts
        - channel_counts
        - daily_trend
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        total_questions:
          type: integer
          format: int64
          minimum: 0
        outcome_counts:
          type: array
