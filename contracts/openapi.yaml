openapi: 3.0.3
info:
  title: Multi-Service Architecture Contracts
  description: >
    OpenAPI contracts for inter-service communication (Gateway, Core, RAG)
    and Kafka event payload specifications.
  version: 1.0.0

tags:
  - name: GatewayToCore
    description: Communication between Chat Gateway (Slack/Teams) and Core system.
  - name: CoreToRag
    description: Communication between Core and RAG/Retrieval service.

paths:
  /api/v1/chat/question:
    post:
      tags:
        - GatewayToCore
      summary: "[Gateway -> Core] Forward user question"
      description: >
        Invoked by the Gateway (Slack/Teams integration) to process an incoming
        user question through Core orchestration.
      operationId: processUserQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserQuestionRequest'
            example:
              query_id: "req-123"
              channel: "teams"
              user_email: "oleh.pona@company.com"
              query: "How to get internet compensation?"
      responses:
        '200':
          description: Question successfully processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQuestionResponse'
              examples:
                Answered:
                  summary: Direct answer generated by RAG
                  value:
                    query_id: "req-123"
                    status: "ANSWERED"
                    reply_text: "To get internet compensation, submit the reimbursement form on SharePoint."
                    citations:
                      - title: "IT Compensation Guidelines"
                        url: "https://company.sharepoint.com/docs/it-comp"
                        document_id: "doc-456"
                        chunk_id: "123e4567-e89b-12d3-a456-426614174000"
                        score: 0.95
                EscalatedToExpert:
                  summary: Low confidence or missing docs, ticket created
                  value:
                    query_id: "req-123"
                    status: "ESCALATED_TO_EXPERT"
                    reply_text: "I couldn't find a confident answer in the knowledge base. I have created a support ticket for an expert to assist you."
                    citations: []
        '400':
          description: Bad Request (invalid user input or malformed payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
              examples:
                BadRequest:
                  value:
                    query_id: "req-123"
                    error_code: "BAD_REQUEST"
                    user_message: "Your question is empty or exceeds the maximum allowed length."
        '500':
          description: Internal Server Error in Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
              examples:
                InternalError:
                  value:
                    query_id: "req-123"
                    error_code: "INTERNAL_ERROR"
                    user_message: "An unexpected error occurred while processing your request."
        '503':
          description: Service Unavailable (downstream RAG/LLM or database outage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
              examples:
                Unavailable:
                  value:
                    query_id: "req-123"
                    error_code: "SERVICE_UNAVAILABLE"
                    user_message: "The knowledge assistant is temporarily unavailable. Please try again in a few minutes."

  /api/v1/rag/generate:
    post:
      tags:
        - CoreToRag
      summary: "[Core -> RAG] Retrieve context and generate answer"
      description: >
        Invoked by Core after resolving user ACL groups. Performs permission-filtered
        retrieval and generates a grounded answer with citations.
      operationId: generateRagAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRetrievalRequest'
            example:
              query_id: "req-123"
              query: "How to get internet compensation?"
              user_permissions:
                allowed_groups:
                  - "devs"
                  - "all-employees"
                  - "oleh.pona@company.com"
      responses:
        '200':
          description: Successfully executed retrieval and generation pipeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagRetrievalResponse'
              examples:
                Success:
                  summary: Relevant documents found and answer generated
                  value:
                    query_id: "req-123"
                    status: "ANSWER_GENERATED"
                    answer: "To get compensation, fill out the reimbursement form..."
                    confidence_score: 0.89
                    citations:
                      - title: "IT Compensation Guidelines"
                        url: "https://company.sharepoint.com/docs/it-comp"
                        document_id: "doc-456"
                        chunk_id: "123e4567-e89b-12d3-a456-426614174000"
                        score: 0.95
                EmptyResult:
                  summary: No matching documents found for query and ACL groups
                  value:
                    query_id: "req-123"
                    status: "EMPTY_RETRIEVAL"
                    answer: null
                    confidence_score: 0.0
                    citations: []
                LowConfidence:
                  summary: Documents found but confidence is below threshold
                  value:
                    query_id: "req-123"
                    status: "LOW_CONFIDENCE"
                    answer: "Based on partial records, compensation might require manager approval..."
                    confidence_score: 0.35
                    citations:
                      - title: "General Expense Policy"
                        url: "https://company.sharepoint.com/docs/expenses"
                        document_id: "doc-789"
                        chunk_id: "987e6543-e21b-12d3-a456-426614174999"
                        score: 0.42
        '400':
          description: Bad Request (malformed JSON or invalid business parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              examples:
                BadRequestError:
                  value:
                    query_id: "req-123"
                    status: "VALIDATION_ERROR"
                    message: "Malformed request payload"
                    description: "JSON body could not be parsed."
                    timestamp: 1730000000
        '422':
          description: Unprocessable Entity (schema validation failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              examples:
                ValidationError:
                  value:
                    query_id: "req-123"
                    status: "VALIDATION_ERROR"
                    message: "Query cannot be empty and allowed_groups must contain at least 1 item"
                    description: "Field 'query' failed minLength validation."
                    timestamp: 1730000000
        '500':
          description: Internal Server Error during RAG pipeline execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              examples:
                InternalPipelineError:
                  value:
                    query_id: "req-123"
                    status: "INTERNAL_ERROR"
                    message: "Unexpected failure during prompt assembly"
                    description: null
                    timestamp: 1730000000
        '503':
          description: Service Unavailable (Vector DB or LLM provider timeout/outage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              examples:
                VectorDBError:
                  value:
                    query_id: "req-123"
                    status: "VECTOR_DB_UNAVAILABLE"
                    message: "Failed to connect to vector database cluster"
                    description: "Connection timed out after 5000ms"
                    timestamp: 1730000000

components:
  schemas:
    # -------------------------------------------------------------
    # REST API SCHEMAS (Gateway <-> Core)
    # -------------------------------------------------------------
    UserQuestionRequest:
      type: object
      required:
        - query_id
        - channel
        - user_email
        - query
      properties:
        query_id:
          type: string
          minLength: 1
          description: Unified correlation/trace ID generated by the Gateway.
        channel:
          type: string
          enum: [slack, teams]
          description: Source communication platform.
        user_email:
          type: string
          format: email
          description: Authenticated user email address.
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Raw question text submitted by the user.

    UserQuestionResponse:
      type: object
      required:
        - query_id
        - status
        - reply_text
        - citations
      properties:
        query_id:
          type: string
          description: Unified correlation/trace ID matching the request.
        status:
          type: string
          enum: [ANSWERED, ESCALATED_TO_EXPERT]
          description: Resolution outcome handled by Core.
        reply_text:
          type: string
          description: Final formatted message to display to the user in Slack/Teams.
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'

    GatewayErrorResponse:
      type: object
      required:
        - query_id
        - error_code
        - user_message
      properties:
        query_id:
          type: string
          nullable: true
          description: Unified correlation/trace ID (null if missing in malformed request).
        error_code:
          type: string
          enum: [BAD_REQUEST, UNAUTHORIZED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
          description: High-level error category for the Gateway.
        user_message:
          type: string
          description: Safe, user-friendly error message suitable for display in chat.

    # -------------------------------------------------------------
    # REST API SCHEMAS (Core <-> RAG)
    # -------------------------------------------------------------
    RagRetrievalRequest:
      type: object
      required:
        - query_id
        - query
        - user_permissions
      properties:
        query_id:
          type: string
          minLength: 1
          description: Unified correlation/trace ID passed from Gateway via Core.
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Sanitized user question text.
        user_permissions:
          $ref: '#/components/schemas/AclPayload'

    RagRetrievalResponse:
      type: object
      required:
        - query_id
        - status
        - confidence_score
        - citations
      properties:
        query_id:
          type: string
          description: Unified correlation/trace ID matching the request.
        status:
          type: string
          enum: [ANSWER_GENERATED, EMPTY_RETRIEVAL, LOW_CONFIDENCE]
          description: >
            Execution status of the RAG pipeline. EMPTY_RETRIEVAL indicates no documents
            matched the query/ACL filter; LOW_CONFIDENCE indicates score below threshold.
        answer:
          type: string
          nullable: true
          description: Generated answer from LLM (null when status is EMPTY_RETRIEVAL).
        confidence_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: >
            Aggregated confidence score. If below threshold (e.g., 0.5) or status is not
            ANSWER_GENERATED, Core escalates to a human expert.
        citations:
          type: array
          description: List of retrieved source chunks supporting the answer (empty if none found).
          items:
            $ref: '#/components/schemas/Citation'

    Citation:
      type: object
      required:
        - title
        - url
        - document_id
        - chunk_id
        - score
      properties:
        title:
          type: string
          description: Human-readable title of the source document.
        url:
          type: string
          format: uri
          description: Direct URL to the source document.
        document_id:
          type: string
          description: Unique identifier of the parent document.
        chunk_id:
          type: string
          format: uuid
          description: Unique UUID of the retrieved text chunk.
        score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance/similarity score of the retrieved chunk.

    GenerationError:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        query_id:
          type: string
          nullable: true
          description: Unified trace ID (null if request parsing failed before extraction).
        status:
          type: string
          enum:
            - VALIDATION_ERROR
            - RETRIEVAL_TIMEOUT
            - VECTOR_DB_UNAVAILABLE
            - LLM_PROVIDER_ERROR
            - INTERNAL_ERROR
          description: Machine-readable error code.
        message:
          type: string
          description: Concise summary of the error.
        description:
          type: string
          nullable: true
          description: Detailed diagnostic information for logs.
        timestamp:
          type: integer
          format: int64
          description: Unix epoch timestamp in seconds when the error occurred.

    # -------------------------------------------------------------
    # SHARED & KAFKA EVENT SCHEMAS
    # -------------------------------------------------------------
    AclPayload:
      type: object
      required:
        - allowed_groups
      properties:
        allowed_groups:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            List of access control groups. Individual user email is included
            as a single-element group identifier.

    # 1. Ingestion Events (discriminator by action)
    KafkaNewFileDataEvent:
      type: object
      description: "Kafka Topic: rag.documents.ingestion.v1"
      discriminator:
        propertyName: action
      oneOf:
        - $ref: '#/components/schemas/DocumentUpsertEvent'
        - $ref: '#/components/schemas/DocumentDeleteEvent'
        - $ref: '#/components/schemas/DocumentUpdateAclEvent'

    DocumentUpsertEvent:
      type: object
      description: "Triggered on document creation or full text update"
      required:
        - document_id
        - action
        - source_system
        - title
        - url
        - raw_content
        - last_updated
        - acl
      properties:
        document_id:
          type: string
        action:
          type: string
          enum: [create, update]
        source_system:
          type: string
          example: "sharepoint"
        title:
          type: string
        url:
          type: string
          format: uri
        raw_content:
          type: string
          description: "Full plain text payload for chunking and embedding."
        last_updated:
          type: string
          format: date-time
        acl:
          $ref: '#/components/schemas/AclPayload'

    DocumentDeleteEvent:
      type: object
      description: "Triggered when a document is deleted from source"
      required:
        - document_id
        - action
      properties:
        document_id:
          type: string
        action:
          type: string
          enum: [delete]

    DocumentUpdateAclEvent:
      type: object
      description: "Triggered when document permissions change without text edits"
      required:
        - document_id
        - action
        - acl
      properties:
        document_id:
          type: string
        action:
          type: string
          enum: [update_acl]
        acl:
          $ref: '#/components/schemas/AclPayload'

    # 2. Chat Feedback Event (синхронізовано з query_id)
    KafkaFeedbackEvent:
      type: object
      description: "Kafka Topic: rag.chat.feedback.v1"
      required:
        - query_id
        - user_email
        - query
        - rating
        - timestamp
      properties:
        query_id:
          type: string
          description: "Correlation ID matching the original user query."
        user_email:
          type: string
          format: email
        query:
          type: string
        rating:
          type: string
          enum: [thumbs_up, thumbs_down]
        comment:
          type: string
          nullable: true
        timestamp:
          type: integer
          format: int64
          description: "Unix epoch timestamp in seconds."

    # 3. Parsed Facts Event
    KafkaFactParsedEvent:
      type: object
      description: "Kafka Topic: rag.facts.parsed.v1"
      required:
        - file_id
        - chunk_hash
        - entity
        - attribute
        - value
        - conditions
      properties:
        file_id:
          type: string
          description: "Source document identifier."
        chunk_hash:
          type: string
          description: "Deterministic hash/ID of the chunk."
        entity:
          type: string
          example: "Vacation"
        attribute:
          type: string
          example: "duration"
        value:
          type: string
          example: "24"
        conditions:
          type: array
          items:
            type: string
          description: "Applicability filters. MUST be sorted alphabetically."
          example: ["contract:b2b", "role:senior"]